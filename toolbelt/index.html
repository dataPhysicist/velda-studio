<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velda Studio</title>
<!-- Toolbelt app page. The app is built from github.com/dataPhysicist/velda-studio and served by jsDelivr,
     pinned to a commit. The page reads release.json from GitHub for the current commit, so a release is
     just a push; if GitHub cannot be reached it uses the FALLBACK commit below. See README. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>html,body,#root{margin:0;height:100%;background:#e9eae4}</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var FALLBACK = '0bde24c88f992cc98887cee9994eca45ad1086f8'
  var REPO = 'dataPhysicist/velda-studio'
  function load(sha) {
    var base = 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/dist/'
    var css = document.createElement('link')
    css.rel = 'stylesheet'
    css.href = base + 'studio.css'
    document.head.appendChild(css)
    var js = document.createElement('script')
    js.type = 'module'
    js.src = base + 'studio.js'
    document.body.appendChild(js)
  }
  var done = false
  var timer = setTimeout(function () { if (!done) { done = true; load(FALLBACK) } }, 2500)
  fetch('https://raw.githubusercontent.com/' + REPO + '/main/release.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null })
    .then(function (j) { if (!done) { done = true; clearTimeout(timer); load((j && /^[0-9a-f]{40}$/.test(j.sha)) ? j.sha : FALLBACK) } })
    .catch(function () { if (!done) { done = true; clearTimeout(timer); load(FALLBACK) } })
})()
</script>
</body>
</html>
